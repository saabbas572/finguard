  <text x="819" y="616" fill="#757575" font-size="14" text-anchor="middle">&#171;import&#187;</text>

  <line x1="1180" y1="626" x2="1258" y2="626" stroke="#757575" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="1219" y="616" fill="#757575" font-size="14" text-anchor="middle">&#171;import&#187;</text>

