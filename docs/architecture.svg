  <line x1="1020" y1="692" x2="1020" y2="758" stroke="#757575" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="1072" y="728" fill="#757575" font-size="14" text-anchor="middle">&#171;import&#187;</text>

