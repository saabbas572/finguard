<svg width="1700" height="1180" viewBox="0 0 1700 1180" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#757575" stroke-width="1.6"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#e65100" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect width="1700" height="1180" fill="#ffffff"/>

  <!-- ================= ROW 1 TOP ================= -->
  <!-- Client App -->
  <g>
    <rect x="60" y="60" width="300" height="40" fill="#4a4a4a"/>
